<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}Zhuoming Chen 陈卓明</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: 'Blog of Zhuoming Chen, Ph.D. student at Carnegie Mellon University.' | escape }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Newsreader:ital,opt@0,400;0,500;1,400&display=swap" rel="stylesheet">

  <style>
    /* ---------- copied from index.html (blocks unchanged; reduced-motion trimmed) ---------- */
    :root {
      --bg: #f7f8fb;
      --bg-soft: #ffffff;
      --bg-card: #ffffff;
      --text: #14181f;
      --text-soft: #545b66;
      --text-faint: #8b929c;
      --border: #e7e9ef;
      --accent: #4f46e5;
      --accent-2: #0ea5e9;
      --accent-soft: rgba(79,70,229,0.10);
      --gold: #b8860b;
      --gold-soft: rgba(184,134,11,0.12);
      --shadow: 0 14px 40px rgba(20,24,31,0.08);
      --shadow-sm: 0 4px 14px rgba(20,24,31,0.06);
      --nav-bg: rgba(247,248,251,0.78);
    }

    html[data-theme="dark"] {
      --bg: #0c0e13;
      --bg-soft: #12151c;
      --bg-card: #151921;
      --text: #e9ecf2;
      --text-soft: #a3abb8;
      --text-faint: #6b7280;
      --border: #242a35;
      --accent: #818cf8;
      --accent-2: #38bdf8;
      --accent-soft: rgba(129,140,248,0.14);
      --gold: #e0b34d;
      --gold-soft: rgba(224,179,77,0.15);
      --shadow: 0 14px 40px rgba(0,0,0,0.45);
      --shadow-sm: 0 4px 14px rgba(0,0,0,0.35);
      --nav-bg: rgba(12,14,19,0.72);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; scroll-padding-top: 80px; }

    body {
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      margin: 0;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.4s ease, color 0.4s ease;
      overflow-x: hidden;
    }

    /* ---------- decorative background ---------- */
    .bg-fx {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.5;
      animation: float 22s ease-in-out infinite;
    }
    .blob.b1 { width: 460px; height: 460px; top: -140px; right: -100px;
      background: radial-gradient(circle, var(--accent), transparent 70%); }
    .blob.b2 { width: 420px; height: 420px; top: 420px; left: -160px;
      background: radial-gradient(circle, var(--accent-2), transparent 70%);
      animation-delay: -8s; }
    .blob.b3 { width: 360px; height: 360px; bottom: -120px; right: 8%;
      background: radial-gradient(circle, #ec4899, transparent 70%);
      opacity: 0.30; animation-delay: -14s; }
    html[data-theme="dark"] .blob { opacity: 0.32; }
    @keyframes float {
      0%,100% { transform: translate(0,0) scale(1); }
      33%     { transform: translate(30px,40px) scale(1.08); }
      66%     { transform: translate(-25px,20px) scale(0.95); }
    }

    /* ---------- nav ---------- */
    nav {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: saturate(180%) blur(14px);
      -webkit-backdrop-filter: saturate(180%) blur(14px);
      background: var(--nav-bg);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      max-width: 980px;
      margin: auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .nav-name {
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.01em;
      text-decoration: none;
      color: var(--text);
      white-space: nowrap;
    }
    .nav-name .cn { color: var(--text-faint); font-weight: 500; margin-left: 4px; }
    .nav-links {
      display: flex;
      gap: 22px;
      align-items: center;
    }
    .nav-links a {
      font-size: 14.5px;
      color: var(--text-soft);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
      position: relative;
    }
    .nav-links a:hover { color: var(--accent); }
    .nav-links a::after {
      content: "";
      position: absolute;
      left: 0; bottom: -5px;
      width: 0; height: 2px;
      background: var(--accent);
      transition: width 0.25s ease;
      border-radius: 2px;
    }
    .nav-links a:hover::after { width: 100%; }

    .theme-toggle {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      width: 36px; height: 36px;
      border-radius: 10px;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 16px;
      transition: transform 0.2s, border-color 0.2s, background 0.2s;
    }
    .theme-toggle:hover { transform: translateY(-1px); border-color: var(--accent); }

    @media (max-width: 720px) {
      .nav-links { gap: 14px; }
      .nav-links a.hide-sm { display: none; }
    }

    /* ---------- layout ---------- */
    .container {
      max-width: 980px;
      margin: auto;
      padding: 0 24px;
    }

    h1 {
      font-size: clamp(34px, 5vw, 46px);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 6px;
      line-height: 1.1;
    }

    /* ---------- sections ---------- */
    section { padding: 56px 0 8px; }
    .sec-head {
      display: flex;
      align-items: baseline;
      gap: 14px;
      margin-bottom: 30px;
    }
    .sec-head h2 {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0;
      white-space: nowrap;
    }
    .sec-head .rule {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--border), transparent);
    }

    /* news */
    .news-list { display: flex; flex-direction: column; gap: 2px; }
    .news-item {
      display: flex;
      gap: 18px;
      padding: 13px 0;
      border-bottom: 1px solid var(--border);
      font-size: 15.5px;
    }
    .news-item:last-child { border-bottom: none; }
    .news-date {
      flex-shrink: 0;
      width: 88px;
      font-weight: 600;
      font-size: 13.5px;
      color: var(--accent);
      padding-top: 2px;
    }
    .news-body { color: var(--text-soft); }
    .news-body strong { color: var(--text); font-weight: 600; }

    /* footer */
    footer {
      margin-top: 64px;
      padding: 34px 0 48px;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--text-faint);
      font-size: 13.5px;
    }
    footer a { color: var(--text-soft); text-decoration: none; border-bottom: 1px solid var(--border); }
    footer a:hover { color: var(--accent); }

    @media (prefers-reduced-motion: reduce) {
      .blob { animation: none; }
      html { scroll-behavior: auto; }
    }

    /* ---------- blog only ---------- */
    .post { max-width: 760px; padding: 56px 0 8px; }
    .post-header { margin-bottom: 30px; }
    .post-date { font-weight: 600; font-size: 13.5px; color: var(--accent); }
    .post-body { font-size: 16.5px; }
    .post-body h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.3; margin: 40px 0 10px; }
    .post-body h3 { font-size: 18px; font-weight: 600; margin: 28px 0 8px; }
    .post-body a, .blog-index .news-body a {
      color: var(--text);
      text-decoration: none;
      border-bottom: 1.5px solid var(--accent);
      font-weight: 500;
      transition: color 0.2s, border-color 0.2s;
    }
    .post-body a:hover, .blog-index .news-body a:hover { color: var(--accent); }
    .post-body li { margin: 4px 0; }
    .blog-index { max-width: 760px; }
    .blog-index .news-date { width: 110px; }
    .blog-index .news-body a { font-weight: 600; }
    .post-desc { display: block; font-size: 14.5px; margin-top: 2px; }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.88em;
      background: var(--accent-soft);
      padding: 1px 5px;
      border-radius: 5px;
    }
    pre {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
      padding: 14px 16px;
      overflow-x: auto;
      line-height: 1.55;
    }
    pre code { background: none; padding: 0; font-size: 13.5px; }
    /* rouge token classes (a few, using the homepage colours) */
    .highlight .c, .highlight .c1, .highlight .cm, .highlight .cp { color: var(--text-faint); font-style: italic; }
    .highlight .k, .highlight .kd, .highlight .kr, .highlight .kt { color: var(--accent); }
    .highlight .m, .highlight .mi, .highlight .mh, .highlight .mf { color: var(--accent-2); }
    .highlight .s, .highlight .s1, .highlight .s2 { color: var(--gold); }

    table { border-collapse: collapse; display: block; overflow-x: auto; font-size: 14.5px; margin: 18px 0; }
    th, td { border: 1px solid var(--border); padding: 7px 12px; text-align: left; }
    th { background: var(--accent-soft); font-weight: 600; }
  </style>
</head>

<body>
  <div class="bg-fx">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>

  <nav>
    <div class="nav-inner">
      <a class="nav-name" href="{{ '/' | relative_url }}">Zhuoming Chen<span class="cn">陈卓明</span></a>
      <div class="nav-links">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/blog/' | relative_url }}">Blog</a>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">🌙</button>
      </div>
    </div>
  </nav>

  <div class="container">
{{ content }}
  </div>

  <script>
    // theme toggle with persistence + system preference
    (function () {
      var root = document.documentElement;
      var btn = document.getElementById('themeToggle');
      var saved = localStorage.getItem('theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = saved || (prefersDark ? 'dark' : 'light');
      apply(theme);
      btn.addEventListener('click', function () {
        theme = (root.getAttribute('data-theme') === 'dark') ? 'light' : 'dark';
        apply(theme);
        localStorage.setItem('theme', theme);
      });
      function apply(t) {
        root.setAttribute('data-theme', t);
        btn.textContent = (t === 'dark') ? '☀️' : '🌙';
      }
    })();
  </script>

</body>
</html>
